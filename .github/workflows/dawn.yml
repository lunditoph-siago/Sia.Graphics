name: Dawn native

on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            runner: windows-latest
            python_arch: x86
          - rid: win-x64
            runner: windows-latest
            python_arch: x64
          - rid: win-arm64
            runner: windows-11-arm
            python_arch: arm64
          - rid: linux-x64
            runner: ubuntu-latest
            python_arch: x64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            python_arch: arm64
          - rid: osx-x64
            runner: macos-15-intel
            python_arch: x64
          - rid: osx-arm64
            runner: macos-latest
            python_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
      - name: Install Linux build dependencies
        if: startsWith(matrix.rid, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev wayland-protocols libxkbcommon-dev libegl-dev libgles-dev
      - uses: actions/cache@v5
        with:
          path: artifacts/dawn
          key: dawn-${{ matrix.rid }}-${{ hashFiles('Sia.WebGPU.Native/Dawn.json', 'Sia.WebGPU.Native/PrepareDawn.ps1', 'Sia.WebGPU.Native/NativeBuildTask.cs', 'Sia.WebGPU.Native/Native.targets', 'Sia.WebGPU.Native/DawnWindows.cpp') }}
      - name: Build Dawn shared library
        shell: pwsh
        run: |
          dotnet build Sia.WebGPU.Native/Sia.WebGPU.Native.cppproj -c Release -r '${{ matrix.rid }}' -p:NativeArtifactsDirectory="$PWD/artifacts/dawn" -p:NativeOutputDirectory="$PWD/artifacts/dawn-runtimes/${{ matrix.rid }}/native"
      - name: Verify native incremental and parallel compilation
        shell: pwsh
        run: ./Sia.WebGPU.Native/TestNativeBuild.ps1 -RuntimeIdentifier '${{ matrix.rid }}'
      - name: Verify C exports and instance lifetime
        run: python Sia.WebGPU.Native/VerifyDawn.py '${{ matrix.rid }}' artifacts/dawn-runtimes
      - uses: actions/upload-artifact@v7
        with:
          name: dawn-${{ matrix.rid }}
          path: artifacts/dawn-runtimes
          if-no-files-found: error
