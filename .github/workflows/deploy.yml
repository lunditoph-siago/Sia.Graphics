name: Deploy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    env:
      BUILD_CONFIG: Release
      SOLUTION: Sia.Graphics.slnx
      EXAMPLES_PROJECT: Sia.WebGPU.Example/Sia.WebGPU.Example.Browser.csproj
      PUBLISH_OUTPUT: ${{ github.workspace }}/artifacts/examples

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.x

      - name: Install SPIR-V workload
        run: |
          dotnet tool install --global Sia.Spirv.Bootstrap
          dotnet spirv install

      - name: Restore WebAssembly workload
        run: dotnet workload restore "$EXAMPLES_PROJECT"

      - name: Restore solution
        run: dotnet restore "$SOLUTION"

      - name: Restore browser examples
        run: dotnet restore "$EXAMPLES_PROJECT"

      - name: Build solution
        run: dotnet build "$SOLUTION" --configuration "$BUILD_CONFIG" --no-restore

      - name: Publish browser examples
        run: >
          dotnet publish "$EXAMPLES_PROJECT"
          --configuration "$BUILD_CONFIG"
          --no-restore
          -p:WasmCachePath="$RUNNER_TEMP/wasm-cache"
          -p:PublishDir="$PUBLISH_OUTPUT/"

      - name: Prepare Pages artifact
        if: github.event_name == 'workflow_dispatch'
        run: touch "$PUBLISH_OUTPUT/wwwroot/.nojekyll"

      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.PUBLISH_OUTPUT }}/wwwroot

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
