<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIA//WEBGPU</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: "Consolas", "SF Mono", "Cascadia Code", "Courier New", monospace;
        }

        #boot {
            position: fixed;
            inset: 0;
            background: #000;
            color: #e8e8e8;
            padding: 28px 32px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            z-index: 20;
            transition: opacity .35s, transform .35s;
        }

        #boot.collapsed {
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
        }

        .tag {
            color: #e8e8e8;
        }

        .fail .tag {
            background: #e8e8e8;
            color: #000;
        }

        .dim {
            color: #777;
        }

        .cursor {
            display: inline-block;
            width: .55em;
            height: 1em;
            background: #e8e8e8;
            vertical-align: text-bottom;
            animation: blink .9s steps(1) infinite;
        }

        @keyframes blink {

            0%,
            49% {
                opacity: 1
            }

            50%,
            100% {
                opacity: 0
            }
        }

        #bar {
            position: fixed;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 6px;
            z-index: 10;
            transform: translateY(-140%);
            transition: transform .3s;
        }

        #bar.visible {
            transform: translateY(0);
        }

        #bar button {
            background: #000;
            color: #999;
            border: 1px solid #444;
            border-radius: 2px;
            padding: 3px 9px;
            font: inherit;
            font-size: 11px;
            letter-spacing: .5px;
            cursor: pointer;
        }

        #bar button:hover {
            color: #fff;
            border-color: #888;
        }

        #bar button.active {
            color: #000;
            background: #e8e8e8;
            border-color: #e8e8e8;
        }

        #stage {
            position: fixed;
            inset: 0;
            opacity: 0;
            transition: opacity .4s;
        }

        #stage.visible {
            opacity: 1;
        }

        #stage iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #000;
        }

        #stage .msg {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            color: #e8e8e8;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
            font-size: 13px;
        }

        #stage .msg h1 {
            font-size: 15px;
            margin: 0;
            font-weight: normal;
        }

        #stage .msg p {
            font-size: 12px;
            color: #777;
            max-width: 480px;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="boot">
        <div id="log"></div>
    </div>
    <div id="bar">
        <button id="btn-dawn" type="button">DAWN</button>
        <button id="btn-wgpu" type="button">WGPU</button>
    </div>
    <div id="stage"></div>
    <script type="module">
        const KEY = 'sia-webgpu-backend';
        const boot = document.getElementById('boot');
        const log = document.getElementById('log');
        const bar = document.getElementById('bar');
        const stage = document.getElementById('stage');
        const btnDawn = document.getElementById('btn-dawn');
        const btnWgpu = document.getElementById('btn-wgpu');

        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        const pad = (s) => s.padEnd(5);

        async function line(tag, text, opts = {}) {
            const el = document.createElement('div');
            if (opts.cls) el.className = opts.cls;
            const tagEl = document.createElement('span');
            tagEl.className = 'tag';
            tagEl.textContent = `[${pad(tag)}] `;
            const textEl = document.createElement('span');
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            el.append(tagEl, textEl, cursor);
            log.appendChild(el);
            for (const ch of text) {
                textEl.textContent += ch;
                log.parentElement.scrollTop = log.parentElement.scrollHeight;
                await sleep(10);
            }
            cursor.remove();
            await sleep(70);
        }
        const info = (text) => line('INFO', text, { cls: 'dim' });

        async function probeAdapter() {
            if (!('gpu' in navigator)) return { ok: false, detail: 'navigator.gpu not found' };
            await line('OK', 'navigator.gpu present');
            await line('CHECK', 'requestAdapter()');
            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) return { ok: false, detail: 'adapter unavailable' };
                const gi = adapter.info ?? (adapter.requestAdapterInfo ? await adapter.requestAdapterInfo() : null);
                const extra = gi
                    ? [gi.vendor, gi.architecture, gi.device, gi.description].filter(Boolean).map((v) => `gpu: ${v}`)
                    : [];
                return { ok: true, extra };
            } catch (err) {
                return { ok: false, detail: `adapter error: ${err?.message ?? err}` };
            }
        }

        async function probeWebGl2() {
            try {
                const gl = document.createElement('canvas').getContext('webgl2');
                if (!gl) return { ok: false, detail: 'webgl2 unavailable' };
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                const extra = dbg
                    ? [gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)].filter(Boolean).map((v) => `renderer: ${v}`)
                    : [];
                return { ok: true, extra };
            } catch (err) {
                return { ok: false, detail: `webgl2 error: ${err?.message ?? err}` };
            }
        }

        async function detect() {
            await line('CHECK', 'navigator.gpu');
            const adapter = await probeAdapter();
            if (adapter.ok) {
                await line('OK', 'adapter acquired');
                for (const e of adapter.extra) await info(e);
                await info('backend = dawn/webgpu');
                return 'dawn';
            }
            await line('WARN', adapter.detail);
            await info('falling back to webgl2');
            await line('CHECK', 'webgl2 context');
            const gl = await probeWebGl2();
            if (gl.ok) {
                await line('OK', 'webgl2 available');
                for (const e of gl.extra) await info(e);
                await info('backend = wgpu/gles');
                return 'wgpu';
            }
            await line('WARN', gl.detail);
            await line('FAIL', 'no compatible backend found', { cls: 'fail' });
            return null;
        }

        function mount(backend) {
            stage.replaceChildren();
            btnDawn.classList.toggle('active', backend === 'dawn');
            btnWgpu.classList.toggle('active', backend === 'wgpu');
            if (backend === null) {
                stage.innerHTML = `<div class="msg">
      <h1>[FAIL] no compatible backend found</h1>
      <p>No WebGPU adapter or WebGL2 context was detected.
      Update your browser, or click a button above to force a backend.</p>
    </div>`;
            } else {
                const frame = document.createElement('iframe');
                frame.title = 'Sia.WebGPU Example';
                frame.src = `${backend}/wwwroot/index.html`;
                stage.appendChild(frame);
            }
            stage.classList.add('visible');
        }

        async function run(forced) {
            log.innerHTML = '';
            boot.classList.remove('collapsed');
            bar.classList.remove('visible');
            stage.classList.remove('visible');

            await line('INIT', 'sia.webgpu bootstrap');
            let backend = forced;
            if (forced) {
                await line('CACHE', `saved profile: ${forced}`);
            } else {
                backend = await detect();
            }
            if (backend !== null) {
                localStorage.setItem(KEY, backend);
                await line('LOAD', `${backend}/index.html`);
            }
            await line('DONE', 'handoff complete');
            await sleep(150);

            mount(backend);
            boot.classList.add('collapsed');
            bar.classList.add('visible');
        }

        btnDawn.addEventListener('click', () => void run('dawn'));
        btnWgpu.addEventListener('click', () => void run('wgpu'));

        const saved = localStorage.getItem(KEY);
        void run(saved === 'dawn' || saved === 'wgpu' ? saved : null);
    </script>
</body>

</html>
