name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.x
            11.x

      - name: Install SPIR-V workload
        run: |
          dotnet tool install --global Sia.Spirv.Bootstrap
          dotnet spirv install

      - name: Restore
        run: dotnet restore Sia.Graphics.slnx

      - name: Run tests
        run: dotnet test Sia.Graphics.slnx --configuration Release --blame-hang --blame-hang-timeout 5m

      - name: Install compiler WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Publish managed compiler consumer
        run: dotnet publish tools/compiler-validation/browser/CompilerHost.csproj -c Release

      - name: Run compiler WebAssembly
        shell: bash
        run: |
          dotnet run --project tools/compiler-validation/CompilerValidation.csproj -c Release -- \
            Sia.Spirv.Compiler.Tests/bin/Release/net11.0/Sia.Spirv.Compiler.Tests.dll \
            Sia.Spirv.Core/bin/Release/net10.0/Sia.Spirv.Core.dll \
            artifacts/compiler-direct
          dotnet run --project tools/compiler-validation/CompilerValidation.csproj -c Release -- \
            Sia.Spirv.Compiler.Tests/bin/Release/net11.0/CilResources.dll \
            Sia.Spirv.Core/bin/Release/net10.0/Sia.Spirv.Core.dll \
            artifacts/compiler-resources
          node tools/compiler-validation/wasm-smoke.mjs \
            tools/compiler-validation/browser/bin/Release/net11.0/publish/wwwroot/_framework/dotnet.js \
            Sia.Spirv.Compiler.Tests/bin/Release/net11.0/CilResources.dll \
            Sia.Spirv.Core/bin/Release/net10.0/Sia.Spirv.Core.dll \
            artifacts/compiler-resources
          node tools/compiler-validation/wasm-smoke.mjs \
            tools/compiler-validation/browser/bin/Release/net11.0/publish/wwwroot/_framework/dotnet.js \
            Sia.Spirv.Compiler.Tests/bin/Release/net11.0/Sia.Spirv.Compiler.Tests.dll \
            Sia.Spirv.Core/bin/Release/net10.0/Sia.Spirv.Core.dll \
            artifacts/compiler-direct
