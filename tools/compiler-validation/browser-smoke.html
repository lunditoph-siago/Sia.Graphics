<!doctype html>
<meta charset="utf-8">
<title>Compiler browser validation</title>
<pre id="result">Running…</pre>
<script type="module">
const result = document.getElementById('result');
const settings = new URLSearchParams(location.search);
const required = name => {
    const value = settings.get(name);
    if (!value) throw new Error('Missing URL parameter: ' + name);
    return new URL(value, location.href).href;
};
try {
    if (settings.has('hostRuntime')) {
        const { dotnet } = await import(required('hostRuntime'));
        await dotnet.create();
    }
    const { createShaderCompiler } = await import(required('loader'));
    const api = await createShaderCompiler(required('runtime'));
    const bytes = async path => new Uint8Array(await (await fetch(path)).arrayBuffer());
    const assembly = await bytes(required('assembly')), intrinsics = await bytes(required('intrinsics'));
    const artifacts = required('artifacts').replace(/\/?$/, '/');
    const entries = await (await fetch(artifacts + 'entries.json')).json();
    if (!entries.length) throw new Error('No shader fixtures were exported.');
    for (const entry of entries) {
        const wgsl = api.ilToWgsl(assembly, entry.token, intrinsics);
        const spirv = api.ilToSpirv(assembly, entry.token, intrinsics);
        const expectedWgsl = await (await fetch(artifacts + entry.name + '.wgsl')).text();
        const expectedSpirv = await bytes(artifacts + entry.name + '.spv');
        if (wgsl !== expectedWgsl || spirv.length !== expectedSpirv.length
            || spirv.some((word, index) => word !== expectedSpirv[index]))
            throw new Error(entry.name + ': browser/native mismatch');
        if (!api.wgslToSpirv(api.spirvToWgsl(spirv)).length) throw new Error('Empty roundtrip');
    }
    result.textContent = 'PASS ' + entries.length + ' fixtures'
        + (settings.has('hostRuntime') ? '; two .NET runtimes coexist.' : '.');
} catch (error) { result.textContent = 'FAIL ' + error.stack; }
</script>
