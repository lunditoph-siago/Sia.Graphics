name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_SDK_VERSION: 11.0.100-preview.7.26381.103
  LLVM_COMMIT: 10eea834e26333cb0d3e71e75faa536144ecc099
  SPIRV_TOOLS_COMMIT: 0539c81f69a3daeb706fd3477dca61435b475156
  SPIRV_HEADERS_COMMIT: ad9184e76a66b1001c29db9b0a3e87f646c64de0
  NATIVE_BUILD_REVISION: 2

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      feature_band: ${{ steps.release.outputs.feature_band }}
    steps:
      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref_type }}' -ne 'tag' -or
              '${{ github.ref_name }}' -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Publishing requires a version tag such as v0.1.0-preview.1.'
          }
          $version = '${{ github.ref_name }}'.Substring(1)
          $match = [Regex]::Match(
            $env:DOTNET_SDK_VERSION,
            '^\d+\.\d+\.\d+(?:-[^.]+\.\d+)?')
          if (!$match.Success) {
            throw "Could not derive a feature band from '$env:DOTNET_SDK_VERSION'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "feature_band=$($match.Value)" >> $env:GITHUB_OUTPUT

  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout dotnet LLVM 23
        uses: actions/checkout@v7
        with:
          repository: dotnet/llvm-project
          ref: ${{ env.LLVM_COMMIT }}
          path: artifacts/dotnet-llvm-project
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SPIRV-Tools
        uses: actions/checkout@v7
        with:
          repository: KhronosGroup/SPIRV-Tools
          ref: ${{ env.SPIRV_TOOLS_COMMIT }}
          path: artifacts/spirv-tools
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout SPIRV-Headers
        uses: actions/checkout@v7
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: ${{ env.SPIRV_HEADERS_COMMIT }}
          path: artifacts/spirv-tools/external/spirv-headers
          fetch-depth: 1
          persist-credentials: false

      - name: Compute native fingerprint
        id: native-build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($source in @(
            @('artifacts/dotnet-llvm-project', $env:LLVM_COMMIT),
            @('artifacts/spirv-tools', $env:SPIRV_TOOLS_COMMIT),
            @('artifacts/spirv-tools/external/spirv-headers', $env:SPIRV_HEADERS_COMMIT))) {
            $actual = git -C $source[0] rev-parse HEAD
            if ($actual -ne $source[1]) {
              throw "Unexpected commit '$actual' in '$($source[0])'."
            }
          }
          if (!(Test-Path artifacts/dotnet-llvm-project/llvm/lib/Target/SPIRV)) {
            throw 'The dotnet LLVM checkout does not contain the SPIR-V backend.'
          }
          $cmakeVersion = (cmake --version | Select-Object -First 1).Trim()
          $ninjaVersion = (ninja --version).Trim()
          if ($IsWindows) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} `
              'Microsoft Visual Studio/Installer/vswhere.exe'
            $compilerVersion = (& $vswhere -latest -products * `
              -property installationVersion).Trim()
          }
          else {
            $compilerVersion = (c++ --version | Select-Object -First 1).Trim()
          }
          $inputText = @(
            '${{ matrix.rid }}',
            $env:LLVM_COMMIT,
            $env:SPIRV_TOOLS_COMMIT,
            $env:SPIRV_HEADERS_COMMIT,
            $env:NATIVE_BUILD_REVISION,
            $cmakeVersion,
            $ninjaVersion,
            $compilerVersion) -join "`n"
          $bytes = [Text.Encoding]::UTF8.GetBytes($inputText)
          $fingerprint = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "fingerprint=$fingerprint" >> $env:GITHUB_OUTPUT

      - name: Restore native cache
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            artifacts/llvm-build-${{ matrix.rid }}
            artifacts/spirv-tools-build-${{ matrix.rid }}
          key: spirv-native-${{ matrix.rid }}-${{ steps.native-build.outputs.fingerprint }}

      - name: Cache Naga
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Sia.Spirv.Naga/target
          key: sia-spirv-naga-${{ matrix.rid }}-${{ hashFiles('Sia.Spirv.Naga/Cargo.lock') }}

      - name: Normalize source timestamps
        if: steps.native-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($repository in @(
            'artifacts/dotnet-llvm-project',
            'artifacts/spirv-tools',
            'artifacts/spirv-tools/external/spirv-headers')) {
            $timestamp = [DateTimeOffset]::Parse(
              (git -C $repository show -s --format=%cI HEAD)).UtcDateTime
            $root = [IO.Path]::GetFullPath($repository)
            foreach ($relativePath in git -C $repository ls-files) {
              $path = [IO.Path]::GetFullPath((Join-Path $root $relativePath))
              if ([IO.File]::Exists($path)) {
                [IO.File]::SetLastWriteTimeUtc($path, $timestamp)
              }
            }
          }

      - name: Build Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arguments = @{
            BuildDirectory = 'artifacts/llvm-build-win-x64'
            InstallDirectory = 'artifacts/llvm-toolchain'
            BuildJobs = 2
          }
          if ('${{ steps.native-cache.outputs.cache-hit }}' -eq 'true') {
            $arguments.SkipConfigure = $true
          }
          ./Sia.Spirv.Toolchain.win-x64/BuildLLVM.ps1 @arguments
          $arguments.BuildDirectory = 'artifacts/spirv-tools-build-win-x64'
          ./Sia.Spirv.Toolchain.win-x64/BuildSpirvTools.ps1 @arguments

      - name: Build Linux toolchain
        if: runner.os == 'Linux'
        shell: bash
        env:
          SIA_NATIVE_SKIP_CONFIGURE: ${{ steps.native-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          ./Sia.Spirv.Toolchain.linux-x64/BuildLLVM.sh
          ./Sia.Spirv.Toolchain.linux-x64/BuildSpirvTools.sh

      - name: Build and stage Windows Naga
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./Sia.Spirv.Toolchain.win-x64/BuildNaga.ps1 `
            -InstallDirectory artifacts/llvm-toolchain

      - name: Build and stage Linux Naga
        if: runner.os == 'Linux'
        shell: bash
        run: ./Sia.Spirv.Toolchain.linux-x64/BuildNaga.sh

      - name: Save native cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            artifacts/llvm-build-${{ matrix.rid }}
            artifacts/spirv-tools-build-${{ matrix.rid }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Run native shader suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeDirectory = Join-Path $env:RUNNER_TEMP 'sia-spirv-native-suite'
          [IO.Directory]::CreateDirectory($smokeDirectory) | Out-Null
          $sources = @{
            compute = @'
          target triple = "spirv64-unknown-vulkan1.2"

          @.str.input = private unnamed_addr constant [6 x i8] c"input\00", align 1
          @.str.output = private unnamed_addr constant [7 x i8] c"output\00", align 1

          define void @compute_main() #0 {
          entry:
            %input = call target("spirv.VulkanBuffer", [0 x float], 12, 1) @llvm.spv.resource.handlefrombinding.tspirv.VulkanBuffer_a0f32_12_1t(i32 0, i32 0, i32 1, i32 0, ptr nonnull @.str.input)
            %output = call target("spirv.VulkanBuffer", [0 x float], 12, 1) @llvm.spv.resource.handlefrombinding.tspirv.VulkanBuffer_a0f32_12_1t(i32 0, i32 1, i32 1, i32 0, ptr nonnull @.str.output)
            %index = call i32 @llvm.spv.thread.id.i32(i32 0)
            %input.ptr = call ptr addrspace(11) @llvm.spv.resource.getpointer.p11.tspirv.VulkanBuffer_a0f32_12_1t(target("spirv.VulkanBuffer", [0 x float], 12, 1) %input, i32 %index)
            %value = load float, ptr addrspace(11) %input.ptr, align 4
            %scaled = fmul float %value, 1.500000e+00
            %biased = fadd float %scaled, 2.500000e-01
            %output.ptr = call ptr addrspace(11) @llvm.spv.resource.getpointer.p11.tspirv.VulkanBuffer_a0f32_12_1t(target("spirv.VulkanBuffer", [0 x float], 12, 1) %output, i32 %index)
            store float %biased, ptr addrspace(11) %output.ptr, align 4
            ret void
          }

          declare i32 @llvm.spv.thread.id.i32(i32)
          declare target("spirv.VulkanBuffer", [0 x float], 12, 1) @llvm.spv.resource.handlefrombinding.tspirv.VulkanBuffer_a0f32_12_1t(i32, i32, i32, i32, ptr)
          declare ptr addrspace(11) @llvm.spv.resource.getpointer.p11.tspirv.VulkanBuffer_a0f32_12_1t(target("spirv.VulkanBuffer", [0 x float], 12, 1), i32)

          attributes #0 = { "hlsl.shader"="compute" "hlsl.numthreads"="8,4,1" }
          '@
            vertex = @'
          target triple = "spirv64-unknown-vulkan1.2"

          @__spirv_BuiltInPosition = external hidden addrspace(8) global <4 x float>
          @vertexColor = external hidden addrspace(8) global <4 x float>, !spirv.Decorations !0

          define void @vertex_main() #0 {
          entry:
            store <4 x float> <float 7.500000e-01, float 5.000000e-01, float 2.500000e-01, float 1.000000e+00>, ptr addrspace(8) @vertexColor, align 16
            store <4 x float> <float -1.000000e+00, float -1.000000e+00, float 0.000000e+00, float 1.000000e+00>, ptr addrspace(8) @__spirv_BuiltInPosition, align 16
            ret void
          }

          attributes #0 = { "hlsl.shader"="vertex" }

          !0 = !{!1}
          !1 = !{i32 30, i32 0}
          '@
            fragment = @'
          target triple = "spirv64-unknown-vulkan1.2"

          @fragmentInput = external hidden addrspace(7) global <4 x float>, !spirv.Decorations !0
          @fragmentColor = external hidden addrspace(8) global <4 x float>, !spirv.Decorations !0

          define void @fragment_main() #0 {
          entry:
            %input = load <4 x float>, ptr addrspace(7) @fragmentInput, align 16
            %color = fmul <4 x float> %input, <float 7.500000e-01, float 7.500000e-01, float 7.500000e-01, float 1.000000e+00>
            store <4 x float> %color, ptr addrspace(8) @fragmentColor, align 16
            ret void
          }

          attributes #0 = { "hlsl.shader"="pixel" }

          !0 = !{!1}
          !1 = !{i32 30, i32 0}
          '@
          }
          $root = if ($IsWindows) {
            'artifacts/llvm-toolchain/bin'
          }
          else {
            'artifacts/llvm-toolchain-linux-x64/bin'
          }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $nativeMagic = [IO.File]::ReadAllBytes(
            (Join-Path $root "llc$suffix"))[0..3]
          if ($IsWindows -and ($nativeMagic[0] -ne 0x4D -or $nativeMagic[1] -ne 0x5A)) {
            throw 'llc is not a PE executable.'
          }
          if (!$IsWindows -and ($nativeMagic -join ',') -ne '127,69,76,70') {
            throw 'llc is not an ELF executable.'
          }
          foreach ($stage in @('compute', 'vertex', 'fragment')) {
            $source = Join-Path $smokeDirectory "$stage.ll"
            $rawSpirv = Join-Path $smokeDirectory "$stage.raw.spv"
            $spirv = Join-Path $smokeDirectory "$stage.spv"
            $wgsl = Join-Path $smokeDirectory "$stage.wgsl"
            $sources[$stage] | Set-Content -LiteralPath $source -Encoding utf8NoBOM
            & (Join-Path $root "llc$suffix") `
              $source -filetype=obj -O 3 -o $rawSpirv
            if ($LASTEXITCODE -ne 0) { throw "$stage llc compilation failed." }
            & (Join-Path $root "spirv-val$suffix") `
              --target-env vulkan1.2 $rawSpirv
            if ($LASTEXITCODE -ne 0) { throw "$stage raw validation failed." }
            & (Join-Path $root "spirv-opt$suffix") `
              -O $rawSpirv -o $spirv
            if ($LASTEXITCODE -ne 0) { throw "$stage WebGPU optimization failed." }
            & (Join-Path $root "spirv-val$suffix") `
              --target-env vulkan1.2 $spirv
            if ($LASTEXITCODE -ne 0) { throw "$stage optimized validation failed." }
            & (Join-Path $root "naga$suffix") $spirv $wgsl
            if ($LASTEXITCODE -ne 0) { throw "$stage WGSL conversion failed." }
            & (Join-Path $root "naga$suffix") $wgsl
            if ($LASTEXITCODE -ne 0) { throw "$stage WGSL validation failed." }
            $bytes = [IO.File]::ReadAllBytes($spirv)
            if ($bytes.Length -lt 20 -or ($bytes[0..3] -join ',') -ne '3,2,35,7') {
              throw "$stage output is not a SPIR-V binary."
            }
            if ((Get-Content -LiteralPath $wgsl -Raw) -notmatch "@$stage") {
              throw "$stage WGSL entry point was not preserved."
            }
          }
          $abiSmoke = Join-Path $smokeDirectory 'verify-native-abi.py'
          @'
          import ctypes
          import pathlib
          import sys

          class Abi(ctypes.Structure):
              _fields_ = [
                  ('version', ctypes.c_uint32),
                  ('struct_size', ctypes.c_uint32),
                  ('status', ctypes.c_int32),
                  ('flags', ctypes.c_uint32),
                  ('input_pointer', ctypes.POINTER(ctypes.c_uint8)),
                  ('input_length', ctypes.c_size_t),
                  ('output_pointer', ctypes.POINTER(ctypes.c_uint8)),
                  ('output_length', ctypes.c_size_t),
              ]

          library = ctypes.CDLL(sys.argv[1])
          library.sia_spirv_abi_version.restype = ctypes.c_uint32
          library.sia_spirv_context_create.restype = ctypes.c_void_p
          library.sia_spirv_context_destroy.argtypes = [ctypes.c_void_p]
          library.sia_spirv_context_abi.argtypes = [ctypes.c_void_p]
          library.sia_spirv_context_abi.restype = ctypes.POINTER(Abi)
          library.sia_spirv_context_resize_input.argtypes = [ctypes.c_void_p, ctypes.c_size_t]
          library.sia_spirv_context_resize_input.restype = ctypes.c_int32
          library.sia_spirv_context_translate.argtypes = [ctypes.c_void_p]
          library.sia_spirv_context_translate.restype = ctypes.c_int32
          if library.sia_spirv_abi_version() != 1:
              raise RuntimeError('Unexpected Sia SPIR-V ABI version.')
          spirv = pathlib.Path(sys.argv[2]).read_bytes()
          context = library.sia_spirv_context_create()
          try:
              if library.sia_spirv_context_resize_input(context, len(spirv)) != 0:
                  raise RuntimeError('Allocating the native ABI input failed.')
              abi = library.sia_spirv_context_abi(context).contents
              ctypes.memmove(abi.input_pointer, spirv, len(spirv))
              if library.sia_spirv_context_translate(context) != 0:
                  abi = library.sia_spirv_context_abi(context).contents
                  raise RuntimeError(ctypes.string_at(
                      abi.output_pointer, abi.output_length).decode())
              abi = library.sia_spirv_context_abi(context).contents
              wgsl = ctypes.string_at(abi.output_pointer, abi.output_length).decode()
              if sys.argv[3] not in wgsl:
                  raise RuntimeError(f"Native ABI did not preserve '{sys.argv[3]}'.")
          finally:
              library.sia_spirv_context_destroy(context)
          '@ | Set-Content -LiteralPath $abiSmoke -Encoding utf8NoBOM
          $abiLibrary = Join-Path $root $(if ($IsWindows) {
            'sia_spirv_naga.dll'
          } else {
            'libsia_spirv_naga.so'
          })
          foreach ($stage in @('compute', 'vertex', 'fragment')) {
            python $abiSmoke $abiLibrary `
              (Join-Path $smokeDirectory "$stage.spv") "@$stage"
            if ($LASTEXITCODE -ne 0) {
              throw "$stage native Naga ABI smoke failed."
            }
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Pack native toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'Sia.Spirv.Toolchain.${{ matrix.rid }}/' +
            'Sia.Spirv.Toolchain.${{ matrix.rid }}.csproj'
          dotnet pack $project --configuration Release `
            --output artifacts/packages `
            -p:Version=${{ needs.prepare.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw 'Native pack failed.' }
          if (!$IsWindows) {
            $package = Get-ChildItem artifacts/packages/*.nupkg | Select-Object -First 1
            $archive = [IO.Compression.ZipFile]::Open(
              $package.FullName, [IO.Compression.ZipArchiveMode]::Update)
            try {
              foreach ($tool in @(
                'llc', 'opt', 'llvm-as', 'llvm-dis', 'libsia_spirv_naga.so', 'naga',
                'spirv-as', 'spirv-dis', 'spirv-link', 'spirv-opt', 'spirv-val')) {
                $archive.GetEntry("tools/linux-x64/$tool").ExternalAttributes = -2115174400
              }
            }
            finally {
              $archive.Dispose()
            }
          }

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: packages-native-${{ matrix.rid }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          compression-level: 0

  managed:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache Naga Wasm
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Sia.Spirv.Naga/target
          key: sia-spirv-naga-browser-${{ hashFiles('Sia.Spirv.Naga/Cargo.lock') }}

      - name: Cache wgpu browser archive
        id: wgpu-browser-cache
        uses: actions/cache@v6
        with:
          path: Sia.WebGPU.Native/runtimes/browser-wasm/native/libwgpu_native.a
          key: wgpu-browser-archive-${{ hashFiles(
            'Sia.WebGPU.Native/ports/siawebgpu/BuildWGPU.sh',
            'Sia.WebGPU.Native/ports/siawebgpu/wgpu-native-v29.0.1.1-emscripten.patch') }}

      - name: Install Rust nightly for wgpu-native
        if: steps.wgpu-browser-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly
          rustup target add wasm32-unknown-emscripten --toolchain nightly

      - name: Install libclang
        if: steps.wgpu-browser-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libclang-dev
          libclang_dir=$(dirname "$(find /usr/lib -name 'libclang-*.so*' \
            -o -name 'libclang.so*' 2>/dev/null | head -n1)")
          echo "LIBCLANG_PATH=$libclang_dir" >> "$GITHUB_ENV"

      - name: Install Emscripten
        if: steps.wgpu-browser-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --quiet --depth 1 \
            https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install latest
          ./emsdk activate latest
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/emsdk" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          node_bin=$(dirname "$(find "$RUNNER_TEMP/emsdk/node" -maxdepth 2 -name node -type f | head -n1)")
          echo "$node_bin" >> "$GITHUB_PATH"

      - name: Build wgpu browser archive
        if: steps.wgpu-browser-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          printf 'int main(){return 0;}' > /tmp/sysroot-probe.c
          emcc /tmp/sysroot-probe.c -o /tmp/sysroot-probe.js
          export EMSCRIPTEN_SYSROOT="$EMSDK/upstream/emscripten/cache/sysroot"
          ./Sia.WebGPU.Native/ports/siawebgpu/BuildWGPU.sh \
            Sia.WebGPU.Native/runtimes/browser-wasm/native/libwgpu_native.a

      - name: Pack managed packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            'Sia.Graphics/Sia.Graphics.csproj',
            'Sia.RenderGraph/Sia.RenderGraph.csproj',
            'Sia.Spirv.Core/Sia.Spirv.Core.csproj',
            'Sia.Spirv.Runtime/Sia.Spirv.Runtime.csproj',
            'Sia.Spirv.Sdk/Sia.Spirv.Sdk.csproj',
            'Sia.Spirv.Bootstrap/Sia.Spirv.Bootstrap.csproj',
            'Sia.Spirv.Workload.Manifest/Sia.Spirv.Workload.Manifest.csproj',
            'Sia.WebGPU/Sia.WebGPU.csproj',
            'Sia.WebGPU.Generators/Sia.WebGPU.Generators.csproj',
            'Sia.WebGPU.Native/Sia.WebGPU.Native.csproj')
          foreach ($project in $projects) {
            dotnet pack $project --configuration Release `
              --output artifacts/packages `
              -p:Version=${{ needs.prepare.outputs.version }} `
              -p:SiaSpirvSdkFeatureBand=${{ needs.prepare.outputs.feature_band }}
            if ($LASTEXITCODE -ne 0) { throw "Packing '$project' failed." }
          }
          $packages = @(Get-ChildItem artifacts/packages/*.nupkg)
          if ($packages.Count -ne 10) {
            throw "Expected ten managed packages, found $($packages.Count)."
          }

      - name: Upload managed packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-managed
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          compression-level: 0

  verify:
    needs: [prepare, native, managed]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: artifacts/packages

      - name: Verify and install packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Sia.Spirv.Workload.Manifest/VerifyPackages.ps1 `
            -PackageDirectory artifacts/packages `
            -PackageVersion '${{ needs.prepare.outputs.version }}' `
            -SdkFeatureBand '${{ needs.prepare.outputs.feature_band }}'
          $toolPath = Join-Path $env:RUNNER_TEMP 'sia-spirv-bootstrap'
          dotnet tool install Sia.Spirv.Bootstrap `
            --tool-path $toolPath `
            --add-source artifacts/packages `
            --version '${{ needs.prepare.outputs.version }}' `
            --no-cache
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap tool install failed.' }
          $shim = Join-Path $toolPath $(if ($IsWindows) {
            'dotnet-spirv.exe'
          } else {
            'dotnet-spirv'
          })
          & $shim install `
            --dotnet (Get-Command dotnet).Source `
            --source (Resolve-Path artifacts/packages).Path
          if ($LASTEXITCODE -ne 0) { throw 'Workload install failed.' }

      - name: Test installed WebGPU workload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'Sia.Spirv.Workload.Tests/Sia.Spirv.Workload.Tests.csproj'
          dotnet restore $project
          if ($LASTEXITCODE -ne 0) { throw 'Workload test restore failed.' }
          dotnet test $project --configuration Release --no-restore `
            -p:UseSharedCompilation=false -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { throw 'Installed workload tests failed.' }

      - name: Verify packaged native and browser tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD 'Sia.Spirv.Workload.Tests/bin/Release/net11.0/spirv'
          $modules = @(Get-ChildItem -LiteralPath $output -Filter '*.spv')
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $validator = Join-Path $env:DOTNET_ROOT (
            'packs/Sia.Spirv.Toolchain.${{ matrix.rid }}/' +
              '${{ needs.prepare.outputs.version }}/tools/${{ matrix.rid }}/spirv-val' +
              $suffix)
          $naga = Join-Path $env:DOTNET_ROOT (
            'packs/Sia.Spirv.Toolchain.${{ matrix.rid }}/' +
            '${{ needs.prepare.outputs.version }}/tools/${{ matrix.rid }}/naga' +
            $suffix)
          foreach ($module in $modules) {
            & $validator --target-env vulkan1.2 $module.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged spirv-val failed for '$($module.Name)'."
            }
            $wgsl = Join-Path $output "$($module.BaseName).wgsl"
            & $naga $wgsl
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged naga failed for '$([IO.Path]::GetFileName($wgsl))'."
            }
          }
          $sdkBrowser = Join-Path $env:DOTNET_ROOT (
            'packs/Sia.Spirv.Sdk/${{ needs.prepare.outputs.version }}/tools/browser')
          $wasm = Join-Path $sdkBrowser 'sia-spirv-naga.wasm'
          $loader = Join-Path $sdkBrowser 'sia-spirv-polyfill.js'
          if (!(Test-Path -LiteralPath $wasm) -or !(Test-Path -LiteralPath $loader)) {
            throw 'The packaged Naga browser ABI is incomplete.'
          }
          $nodeSmoke = Join-Path $env:RUNNER_TEMP 'verify-naga-abi.mjs'
          @'
          import { readFile } from 'node:fs/promises';
          import { pathToFileURL } from 'node:url';

          const [loaderPath, wasmPath, spirvPath, expectedStage] = process.argv.slice(2);
          const [{ createSpirvPolyfill }, wasm, spirv] = await Promise.all([
            import(pathToFileURL(loaderPath)),
            readFile(wasmPath),
            readFile(spirvPath),
          ]);
          const translate = await createSpirvPolyfill(
            `data:application/wasm;base64,${wasm.toString('base64')}`);
          const wgsl = translate(spirv);
          translate.dispose();
          if (!wgsl.includes(expectedStage)) {
            throw new Error(`Naga Wasm did not preserve '${expectedStage}'.`);
          }
          '@ | Set-Content -LiteralPath $nodeSmoke -Encoding utf8NoBOM
          foreach ($module in $modules) {
            $expectedStage = if ($module.BaseName -match 'FullscreenVertex') {
              '@vertex'
            } elseif ($module.BaseName -match 'SolidFragment') {
              '@fragment'
            } else {
              '@compute'
            }
            node $nodeSmoke $loader $wasm $module.FullName $expectedStage
            if ($LASTEXITCODE -ne 0) {
              throw "The packaged Naga Wasm ABI failed for '$($module.Name)'."
            }
          }

  release:
    if: github.ref_type == 'tag'
    needs: [prepare, native, managed, verify]
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: artifacts/packages

      - name: Attest packages
        uses: actions/attest@v4
        with:
          subject-path: artifacts/packages/*.nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.prepare.outputs.version }}'
          $featureBand = '${{ needs.prepare.outputs.feature_band }}'
          $packageIds = @(
            'Sia.Graphics',
            'Sia.RenderGraph',
            'Sia.Spirv.Core',
            'Sia.Spirv.Runtime',
            'Sia.Spirv.Sdk',
            'Sia.Spirv.Bootstrap',
            'Sia.Spirv.Toolchain.win-x64',
            'Sia.Spirv.Toolchain.linux-x64',
            "Sia.Spirv.Workload.Manifest-$featureBand",
            'Sia.WebGPU',
            'Sia.WebGPU.Generators',
            'Sia.WebGPU.Native')
          foreach ($packageId in $packageIds) {
            $package = "artifacts/packages/$packageId.$version.nupkg"
            dotnet nuget push $package `
              --api-key "$env:NUGET_API_KEY" `
              --source 'https://api.nuget.org/v3/index.json' `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "Publishing '$packageId' failed."
            }
          }
          dotnet nuget add source `
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --name github `
            --username "${{ github.repository_owner }}" `
            --password $env:GITHUB_TOKEN `
            --store-password-in-clear-text
          foreach ($packageId in $packageIds) {
            $package = "artifacts/packages/$packageId.$version.nupkg"
            dotnet nuget push $package `
              --api-key "$env:GITHUB_TOKEN" `
              --source github `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "Publishing '$packageId' to GitHub Packages failed."
            }
          }
