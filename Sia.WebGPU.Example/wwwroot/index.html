<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Sia.WebGPU · Cornell Box Path Tracer</title>
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
    <script type="module" src="main#[.{fingerprint}].js"></script>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #preview-controls {
            position: fixed;
            top: 12px;
            right: 12px;
        }

        #preview-controls button {
            padding: 3px 9px;
            border: 1px solid #444;
            border-radius: 2px;
            background: #000;
            color: #e8e8e8;
            font: 11px monospace;
            cursor: pointer;
        }

        #preview-controls button[aria-pressed="true"] {
            background: #e8e8e8;
            color: #000;
        }
    </style>
</head>
<body id="canvas-host">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="preview-controls" hidden>
        <button id="canvas-toggle" type="button" aria-label="Use ordinary Canvas" aria-pressed="false">
            <span id="canvas-mode">OffscreenCanvas</span>
        </button>
        <button id="shader-toggle" type="button" aria-label="Use C# SPIR-V shaders" aria-pressed="false">WGSL</button>
    </div>
</body>
</html>
