<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIA//WEBGPU</title>
    <style>
        :root {
            --bg: #000;
            --fg: #e8e8e8;
            --fg-bright: #fff;
            --muted: #999;
            --dim: #777;
            --border: #444;
            --border-soft: #222;
            --mono: "Consolas", "SF Mono", "Cascadia Code", "Courier New", monospace;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--mono);
        }
        body {
            display: flex;
            flex-direction: column;
        }

        #boot {
            position: fixed;
            inset: 0;
            background: var(--bg);
            color: var(--fg);
            padding: 28px 32px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            z-index: 20;
            transition: opacity .35s, transform .35s;
            &.collapsed {
                opacity: 0;
                transform: translateY(-8px);
                pointer-events: none;
            }
            .tag {
                color: var(--fg);
            }
            .fail .tag {
                background: var(--fg);
                color: var(--bg);
            }
            .dim {
                color: var(--dim);
            }
            .cursor {
                display: inline-block;
                width: .55em;
                height: 1em;
                background: var(--fg);
                vertical-align: text-bottom;
                animation: blink .9s steps(1) infinite;
            }
        }
        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }

        #bar {
            flex: none;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            padding: 6px 10px;
            background: var(--bg);
            border-bottom: 1px solid var(--border-soft);
            transform: translateY(-100%);
            transition: transform .3s;
            &.visible {
                transform: translateY(0);
            }
            button, select, input {
                background: var(--bg);
                color: var(--muted);
                border: 1px solid var(--border);
                border-radius: 2px;
                font: inherit;
                font-size: 11px;
            }
            button {
                padding: 3px 9px;
                letter-spacing: .5px;
                cursor: pointer;
                &:hover {
                    color: var(--fg-bright);
                    border-color: #888;
                }
                &.active {
                    color: var(--bg);
                    background: var(--fg);
                    border-color: var(--fg);
                }
            }
            select {
                padding: 3px 6px;
                cursor: pointer;
            }
            input {
                width: 48px;
                box-sizing: border-box;
                padding: 3px 5px;
            }
            label {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                color: var(--muted);
                font-size: 11px;
                letter-spacing: .5px;
            }
        }

        #profiles {
            display: flex;
            flex: 1 1 auto;
            gap: 6px;
            min-width: 0;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
            touch-action: pan-x;
            -webkit-overflow-scrolling: touch;
            &::-webkit-scrollbar {
                display: none;
            }
            button {
                flex: 0 0 auto;
            }
        }

        .profile-group {
            display: flex;
            flex: 0 0 auto;
            gap: 3px;
            & + & {
                margin-left: 2px;
                padding-left: 5px;
                border-left: 1px solid var(--border-soft);
            }
        }

        #shared-controls {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            padding-left: 6px;
            background: var(--bg);
            border-left: 1px solid var(--border-soft);
        }

        #stage {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            opacity: 0;
            transition: opacity .4s;
            &.visible {
                opacity: 1;
            }
            iframe {
                width: 100%;
                height: 100%;
                border: 0;
                display: block;
                background: var(--bg);
            }
            .msg {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 10px;
                color: var(--fg);
                text-align: center;
                padding: 24px;
                box-sizing: border-box;
                font-size: 13px;
                h1 {
                    font-size: 15px;
                    margin: 0;
                    font-weight: normal;
                }
                p {
                    font-size: 12px;
                    color: var(--dim);
                    max-width: 480px;
                    margin: 0;
                }
            }
        }
    </style>
</head>

<body>
    <div id="boot">
        <div id="log"></div>
    </div>
    <div id="bar">
        <div id="profiles">
            <div class="profile-group" role="group" aria-label="Backend">
                <button type="button" data-backend="dawn">DAWN</button>
                <button type="button" data-backend="wgpu">WGPU</button>
            </div>
            <div class="profile-group" role="group" aria-label="Shader format">
                <button type="button" data-shader="wgsl">WGSL</button>
                <button type="button" data-shader="spirv">SPV</button>
            </div>
        </div>
        <div id="shared-controls">
            <label for="render-scale">SCALE
                <input id="render-scale" type="number" min="1" max="3" step="0.25" value="1" />×
            </label>
        </div>
    </div>
    <div id="stage"></div>
    <script type="module">
        const KEY = 'sia-webgpu-backend';
        const SCALE_KEY = 'sia-webgpu-render-scale';
        const MAX_MANUAL_SCALE = 3;
        const MAX_AUTO_SCALE = 3;
        const boot = document.getElementById('boot');
        const log = document.getElementById('log');
        const bar = document.getElementById('bar');
        const stage = document.getElementById('stage');
        const backendButtons = [...document.querySelectorAll('[data-backend]')];
        const shaderButtons = [...document.querySelectorAll('[data-shader]')];
        const renderScale = document.getElementById('render-scale');
        const profiles = {
            'dawn-wgsl': { backend: 'dawn/webgpu', shader: 'handwritten WGSL' },
            'wgpu-wgsl': { backend: 'wgpu/gles', shader: 'handwritten WGSL' },
            'dawn-spirv': { backend: 'dawn/webgpu', shader: 'C# SPIR-V via Naga' },
            'wgpu-spirv': { backend: 'wgpu/gles', shader: 'C# SPIR-V' },
        };
        let mountedProfile = null;

        const round2 = (n) => Math.round(n * 100) / 100;

        function computeScale(savedValue) {
            if (savedValue) {
                const manualScale = Number(savedValue);
                if (Number.isFinite(manualScale)) {
                    return Math.min(MAX_MANUAL_SCALE, Math.max(1, manualScale));
                }
            }

            const width = Math.max(1, stage.clientWidth || window.innerWidth || 1);
            const height = Math.max(1, stage.clientHeight || window.innerHeight || 1);
            const screenWidth = Math.max(1, window.screen?.width || width);
            const screenHeight = Math.max(1, window.screen?.height || height);
            const dpr = Number.isFinite(window.devicePixelRatio)
                ? Math.max(1, window.devicePixelRatio)
                : 1;
            const widthScale = screenWidth * dpr / width;
            const heightScale = screenHeight * dpr / height;
            return Math.min(MAX_AUTO_SCALE, Math.max(1, Math.min(widthScale, heightScale)));
        }

        function layoutFrame() {
            const frame = stage.querySelector('iframe');
            if (!frame) return;
            const scale = computeScale(localStorage.getItem(SCALE_KEY));
            const w = Math.max(1, Math.round(stage.clientWidth));
            const h = Math.max(1, Math.round(stage.clientHeight));
            frame.style.position = 'absolute';
            frame.style.top = '0';
            frame.style.left = '0';
            frame.style.width = `${Math.round(w * scale)}px`;
            frame.style.height = `${Math.round(h * scale)}px`;
            frame.style.transformOrigin = 'top left';
            frame.style.transform = `scale(${1 / scale})`;
            if (document.activeElement !== renderScale) {
                renderScale.value = round2(scale);
            }
        }

        renderScale.value = round2(computeScale(localStorage.getItem(SCALE_KEY)));

        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        const pad = (s) => s.padEnd(5);

        async function line(tag, text, opts = {}) {
            const el = document.createElement('div');
            if (opts.cls) el.className = opts.cls;
            const tagEl = document.createElement('span');
            tagEl.className = 'tag';
            tagEl.textContent = `[${pad(tag)}] `;
            const textEl = document.createElement('span');
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            el.append(tagEl, textEl, cursor);
            log.appendChild(el);
            for (const ch of text) {
                textEl.textContent += ch;
                log.parentElement.scrollTop = log.parentElement.scrollHeight;
                await sleep(10);
            }
            cursor.remove();
            await sleep(70);
        }
        const info = (text) => line('INFO', text, { cls: 'dim' });

        async function probeAdapter() {
            if (!('gpu' in navigator)) return { ok: false, detail: 'navigator.gpu not found' };
            await line('OK', 'navigator.gpu present');
            await line('CHECK', 'requestAdapter()');
            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) return { ok: false, detail: 'adapter unavailable' };
                const gi = adapter.info ?? (adapter.requestAdapterInfo ? await adapter.requestAdapterInfo() : null);
                const extra = gi
                    ? [gi.vendor, gi.architecture, gi.device, gi.description].filter(Boolean).map((v) => `gpu: ${v}`)
                    : [];
                return { ok: true, extra };
            } catch (err) {
                return { ok: false, detail: `adapter error: ${err?.message ?? err}` };
            }
        }

        async function probeWebGl2() {
            try {
                const gl = document.createElement('canvas').getContext('webgl2');
                if (!gl) return { ok: false, detail: 'webgl2 unavailable' };
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                const extra = dbg
                    ? [gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)].filter(Boolean).map((v) => `renderer: ${v}`)
                    : [];
                return { ok: true, extra };
            } catch (err) {
                return { ok: false, detail: `webgl2 error: ${err?.message ?? err}` };
            }
        }

        async function detect() {
            await line('CHECK', 'navigator.gpu');
            const adapter = await probeAdapter();
            if (adapter.ok) {
                await line('OK', 'adapter acquired');
                for (const e of adapter.extra) await info(e);
                await info('backend = dawn/webgpu');
                return 'dawn-wgsl';
            }
            await line('WARN', adapter.detail);
            await info('falling back to webgl2');
            await line('CHECK', 'webgl2 context');
            const gl = await probeWebGl2();
            if (gl.ok) {
                await line('OK', 'webgl2 available');
                for (const e of gl.extra) await info(e);
                await info('backend = wgpu/gles');
                return 'wgpu-wgsl';
            }
            await line('WARN', gl.detail);
            await line('FAIL', 'no compatible backend found', { cls: 'fail' });
            return null;
        }

        function mount(profileId) {
            mountedProfile = profileId;
            stage.replaceChildren();
            const [backend, shader] = profileId?.split('-') ?? [];
            for (const button of backendButtons) {
                button.classList.toggle('active', button.dataset.backend === backend);
            }
            for (const button of shaderButtons) {
                button.classList.toggle('active', button.dataset.shader === shader);
            }
            if (profileId === null) {
                stage.innerHTML = `<div class="msg">
      <h1>[FAIL] no compatible backend found</h1>
      <p>No WebGPU adapter or WebGL2 context was detected.
      Update your browser, or click a button above to force a backend.</p>
    </div>`;
            } else {
                const frame = document.createElement('iframe');
                frame.title = 'Sia.WebGPU Example';
                frame.src = `${profileId}/wwwroot/index.html`;
                stage.appendChild(frame);
                layoutFrame();
            }
        }

        function reveal() {
            stage.classList.add('visible');
            boot.classList.add('collapsed');
            bar.classList.add('visible');
        }

        async function run(forced) {
            log.innerHTML = '';
            boot.classList.remove('collapsed');
            bar.classList.remove('visible');
            stage.classList.remove('visible');

            await line('INIT', 'sia.webgpu bootstrap');
            let profileId = forced;
            if (forced) {
                await line('CACHE', `saved profile: ${forced}`);
            } else {
                profileId = await detect();
            }
            if (profileId !== null) {
                localStorage.setItem(KEY, profileId);
                const profile = profiles[profileId];
                await info(`backend = ${profile.backend}`);
                await info(`shader = ${profile.shader}`);
                await line('LOAD', `${profileId}/index.html`);
            }

            mount(profileId);

            await line('DONE', 'handoff complete');
            await sleep(150);

            reveal();
        }

        for (const button of backendButtons) {
            button.addEventListener('click', () => {
                const shader = mountedProfile?.split('-')[1] ?? 'wgsl';
                void run(`${button.dataset.backend}-${shader}`);
            });
        }
        for (const button of shaderButtons) {
            button.addEventListener('click', () => {
                const backend = mountedProfile?.split('-')[0] ?? 'dawn';
                void run(`${backend}-${button.dataset.shader}`);
            });
        }
        renderScale.addEventListener('change', () => {
            const value = Number(renderScale.value);
            if (!Number.isFinite(value)) {
                return;
            }
            const clamped = Math.min(MAX_MANUAL_SCALE, Math.max(1, value));
            renderScale.value = clamped;
            localStorage.setItem(SCALE_KEY, String(clamped));
            layoutFrame();
        });
        window.addEventListener('resize', () => {
            if (mountedProfile !== null) {
                layoutFrame();
            }
        });

        const saved = localStorage.getItem(KEY);
        void run(saved in profiles ? saved : null);
    </script>
</body>

</html>
